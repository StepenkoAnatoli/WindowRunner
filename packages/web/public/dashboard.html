<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Windows Runner — Providers</title>
    <!-- Namespaced paths: the dashboard's static mount is /dashboard/..., so
         from the /dashboard page a bare "dashboard.js" would resolve to
         /dashboard.js (served by the main app's static mount, 404). -->
    <link rel="stylesheet" href="/dashboard/dashboard.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/dashboard/dashboard.js"></script>
  </body>
</html>
