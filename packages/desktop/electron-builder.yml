# electron-builder configuration — WindowRunner desktop shell (PR A / A2).
#
# Windows NSIS installer only (macOS/Linux targets are out of scope for A2).
# Build it with `npm run package:win` from this workspace (root alias:
# `npm run package:desktop:win`); CI proves the whole story on windows-latest:
# build -> silent install -> user-journey e2e against the INSTALLED app ->
# silent uninstall (see .github/workflows/ci.yml -> desktop-installer).

appId: com.stepenkoanatoli.windowrunner
productName: WindowRunner

# The one-click per-user NSIS install directory is derived from the PACKAGED
# app's `name` (app-builder-lib getWindowsInstallationDirName resolves to
# appInfo.sanitizedName in this install mode), and the workspace package name
# is the internal scoped `@windows-runner/desktop` — which would install to
# %LOCALAPPDATA%\Programs\@windows-runnerdesktop. Override the packaged
# metadata so the canonical install directory is
# %LOCALAPPDATA%\Programs\WindowRunner and the runtime app name matches the
# product identity. The workspace manifest itself is untouched. Pinned in
# test/packaging.test.ts and asserted at the explicit path by the installer
# CI gate.
extraMetadata:
  name: WindowRunner

directories:
  output: release
  buildResources: build

# Only the compiled shell travels inside the app archive (package.json `main`
# points at dist/main.cjs). dist/resources/ is intentionally NOT listed here:
# that staged payload ships once via extraResources, below.
files:
  - dist/main.cjs
  - dist/preload.cjs

# scripts/copy-assets.mjs stages dist/resources/ with the monorepo geometry the
# bundled server resolves at runtime. It is copied VERBATIM onto
# process.resourcesPath, so the packaged layout is
#   <resources>/packages/server/dist/index.cjs
#   <resources>/packages/web/dist/{app,dashboard}/
#   <resources>/packages/desktop/dist/renderer/
# which is exactly what src/main.ts's resolveServerBundle() expects — the
# test/packaging.test.ts contract pins both sides together.
extraResources:
  - from: dist/resources
    to: .

# No runtime dependencies to rebuild: the packaged app is Electron plus our two
# .cjs files plus the staged payload.
npmRebuild: false

win:
  target:
    - nsis
  # B5.3 — Authenticode code signing. Signing is credential-driven, not
  # config-driven: with `win.sign` unset, electron-builder signs every
  # executable it produces (app exe, uninstaller, NSIS installer) when
  # WIN_CSC_LINK (or CSC_LINK) + WIN_CSC_KEY_PASSWORD are present — WIN_CSC_LINK
  # accepts a .pfx/.p12 file path, an https:// URL, or base64 content, which is
  # the shape the release workflow passes from repo secrets — and silently
  # SKIPS signing when they are absent, so local and PR builds stay green
  # unsigned. `npm run package:desktop:win:release` additionally sets
  # forceCodeSigning, which fails a build that could not sign instead of
  # shipping silently unsigned. The CI "Desktop signing" job proves the whole
  # pipeline on every PR with a self-signed test certificate.
  signtoolOptions:
    # SHA-256 only. The electron-builder default is ['sha1', 'sha256'] (a
    # legacy SHA-1 signature plus a nested SHA-256 one); no supported Windows
    # needs the SHA-1 leg, so we drop it.
    signingHashAlgorithms:
      - sha256
    # rfc3161TimeStampServer keeps its electron-builder default
    # (http://timestamp.digicert.com): signatures are counter-signed at build
    # time so they stay verifiable after the certificate expires. The CI
    # signing-proof job disables it (ELECTRON_BUILDER_OFFLINE=true) because its
    # throwaway test certificate needs no timestamp and no external service.
    # v27 note: when electron-builder is upgraded past v26, `signtoolOptions`
    # moves under the unified `win.sign` key — `npx electron-builder
    # migrate-schema` rewrites this automatically.

nsis:
  oneClick: true
  # Per-user install (no admin/UAC): %LOCALAPPDATA%\Programs\WindowRunner.
  perMachine: false
  # User data in %APPDATA%\WindowRunner (sessions, provider profiles, logs)
  # survives uninstall — see docs/INSTALL.md, "Windows desktop app".
  deleteAppDataOnUninstall: false
  # Do not auto-launch after install: the A2 gate launches the installed app
  # explicitly (and an auto-started instance would still be running during the
  # uninstall assertion). Humans launch from the Start Menu.
  runAfterFinish: false
  artifactName: "WindowRunner-Setup-${version}.${ext}"

# No icon yet: default Electron icon (branding is a separate milestone). Code
# signing is configured above: env-driven (WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD),
# proven in CI with a test certificate, and enforced for release builds via
# forceCodeSigning. Until a production certificate is provided as a repo
# secret, official installers are unsigned and SmartScreen warns — see
# docs/INSTALL.md → "Code signing and SmartScreen".
