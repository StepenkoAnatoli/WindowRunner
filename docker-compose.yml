# Windows Runner compose topology.
#
# Status (2026-09-20): unblocked — the image runs the self-contained server
# bundle `packages/server/dist/index.cjs` (packaging gaps G-03/G-04 closed),
# so the runtime container needs no node_modules or monorepo workspace
# symlinks. See docs/INSTALL.md ("Docker") and RELEASE_CHECKLIST.md.
#
# Security note: every /api route requires `Authorization: Bearer <token>`.
# The token is generated on first boot into the data volume at
# /home/node/.windows-runner/auth-token — read it with
#   docker compose exec windows-runner cat /home/node/.windows-runner/auth-token
# or pin your own with WINDOWS_RUNNER_AUTH_TOKEN below. The published port is
# still loopback-only: the token travels over plain HTTP, so keep it off shared
# networks unless TLS terminates in front (docs/INSTALL.md, "Remote access").
# The container binds 0.0.0.0 only inside its own network namespace, which the
# entry point requires WINDOWS_RUNNER_ALLOW_REMOTE=1 to acknowledge.
services:
  windows-runner:
    build: .
    # Reap child processes (the agent spawns MCP servers and terminal commands).
    init: true
    ports:
      # Loopback only: the bearer token travels over plain HTTP. Change to
      # "7634:7634" only if you intentionally want LAN access AND terminate TLS
      # in front — WINDOWS_RUNNER_ALLOW_REMOTE=1 below only acknowledges the
      # non-loopback bind inside the container's network namespace.
      - "127.0.0.1:7634:7634"
    volumes:
      # Config, sessions and crash reports persist across container restarts.
      - windows-runner-data:/home/node/.windows-runner
      # The folder the agent may read and edit. The container runs as the
      # unprivileged `node` user, so nothing outside this mount and the data
      # volume is written to.
      - ${PWD:-.}:/work
    working_dir: /work
    environment:
      - HOST=0.0.0.0
      - PORT=7634
      # Acknowledges that the container binds all interfaces inside its own
      # network namespace; the published port above is still loopback-only.
      # The entry point refuses a non-loopback bind without this.
      - WINDOWS_RUNNER_ALLOW_REMOTE=1
      # Sessions may only be rooted inside the mounted workspace.
      - WINDOWS_RUNNER_ALLOWED_ROOTS=/work
      - WINDOWS_RUNNER_PERSISTENCE_MODE=file
      - WINDOWS_RUNNER_DATA_DIR=/home/node/.windows-runner
      # Optional: pin the API token instead of using the generated one in the
      # data volume. Must be at least 16 characters with no whitespace.
      # - WINDOWS_RUNNER_AUTH_TOKEN=change-me-to-a-long-random-value
    # `node` (uid 1000 in the image) needs write access to ${PWD}. If your host
    # uid differs, run with `user: "${UID}:${GID}"` or fix ownership; see
    # docs/INSTALL.md.
    user: node

volumes:
  windows-runner-data:
