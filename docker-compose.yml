# Docker topology for the self-contained server artifact.
#
# The image runs packages/server/dist/index.cjs, which is bundled with express
# and shared runtime code. No workspace node_modules or source tree is needed in
# the final image. A Docker daemon/job is still part of final hardening; this
# compose file is not a claim that Docker has been executed in the current CI.
services:
  windows-runner:
    build: .
    # Reap child processes (the agent may spawn MCP servers and terminal commands).
    init: true
    ports:
      # Loopback only on the host. Change to "7634:7634" only if LAN access is
      # intentional, and keep the explicit remote-bind acknowledgement below.
      - "127.0.0.1:7634:7634"
    volumes:
      # Config, sessions and turn logs persist across container restarts.
      - windows-runner-data:/home/node/.windows-runner
      # The folder the agent may read and edit. The container runs as the
      # unprivileged node user, so nothing outside this mount is authorized.
      - ${PWD:-.}:/work
    working_dir: /work
    environment:
      - HOST=0.0.0.0
      - PORT=7634
      # The container binds all interfaces inside its own network namespace;
      # the published host port above remains loopback-only.
      - WINDOWS_RUNNER_ALLOW_REMOTE=1
      - WINDOWS_RUNNER_ALLOWED_ROOTS=/work
      - WINDOWS_RUNNER_PERSISTENCE_MODE=file
      - WINDOWS_RUNNER_DATA_DIR=/home/node/.windows-runner
    # node (uid 1000 in the image) needs write access to ${PWD}. If your host
    # uid differs, run with user: "${UID}:${GID}" or fix ownership.
    user: node

volumes:
  windows-runner-data:
