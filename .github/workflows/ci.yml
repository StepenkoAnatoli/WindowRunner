# The nine required checks of the merge gate — every PR run must land all nine
# green before merge. The first eight are the B2 merge gate (plan B2.5.4); the
# ninth (Desktop signing) was added by B5 to prove the code-signing pipeline:
#   1. CI
#   2. Browser E2E
#   3. Docker
#   4. Platform (windows-latest)
#   5. Platform (macos-latest)
#   6. Desktop (ubuntu-latest)
#   7. Desktop (windows-latest)
#   8. Desktop installer (windows-latest)  (B5 also verifies in-place upgrade
#      and data-surviving uninstall here)
#   9. Desktop signing (windows-latest)
# The two inventory steps below ("Enforce B2 browser contract inventory",
# "Enforce B2 desktop contract inventory") fail the run if the B2 spec files
# are deleted, renamed, or stop being discovered — the coverage cannot shrink
# silently while the checks stay green.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Only the Desktop jobs need Electron's ~100MB binary; the rest of CI
      # skips the download (electron's install script honors this flag).
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned exact version: Node 20 is EOL (security fixes ended 2026-04-30);
          # Node 22 is Active LTS and satisfies the repo's engines (>=22.0.0).
          node-version: "22.23.2"
          cache: npm

      # A plain `npm ci`, with no --ignore-scripts: the root package.json declares
      # `postinstall: node scripts/postinstall.mjs`, and that script now exists and
      # verifies the workspace tree. An earlier revision of this workflow had to
      # skip lifecycle scripts because scripts/ was absent from main, which meant
      # CI could not tell a healthy install from a broken one. Running the hook is
      # the point of this step. See docs/INSTALL.md.
      - name: Install dependencies (clean, lockfile-driven)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # B5.1 release gate: the root package.json version is the single source
      # of truth; every workspace must agree (the desktop installer embeds the
      # workspace version, the web bundle injects the root version). The
      # changelog checks (B5.2) ride in the same script.
      - name: Release consistency gate
        run: npm run check:release

      # B5.8 security gate: the shipped artifact must not grow a vulnerable
      # runtime dependency unnoticed. Today the product has zero runtime npm
      # dependencies (the server bundle is self-contained; the desktop app
      # ships compiled .cjs files) — this step exists so that staying true
      # keeps being enforced, not assumed. Dev-only tooling is deliberately
      # not audited here.
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      # Asserts the packed tarball matches the manifest contract: dist/ only, no
      # sources, no tests, and bin points to existing files.
      - name: Packed-artifact smoke test
        run: npm run smoke:packed

      # Unpacks the packed tarball in an isolated directory outside the source
      # tree and verifies that `npm start` boots and serves health requests.
      - name: Packed-tarball start smoke test
        run: npm run smoke:packed:start

      # Boots the compiled server (packages/server/dist/index.cjs) as a child
      # process in file-persistence mode against a temp data dir, runs a turn
      # through the offline mock provider over SSE, restarts it to check
      # recovery, and asserts a clean exit on SIGTERM.
      - name: Startup smoke test
        run: npm run smoke:start

      # Evaluation harness in scripted mode: real server + openai-compatible
      # adapter + built-in tools + approvals, driven by scripted "model"
      # solutions against a fake OpenAI endpoint. No key, no network. Proves
      # the harness and the tool path end to end; real-model runs are manual
      # (eval/README.md) and never part of CI.
      - name: Evaluation harness (scripted, no keys)
        run: npm run eval -- --expect-pass --out eval-scripted.json

      - name: Collect diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo "== node =="
            node --version
            echo "== npm =="
            npm --version
            echo "== git =="
            git --version
            echo "== git status =="
            git status --short
            echo "== workspace manifests =="
            node -e 'const p=require("./package.json");console.log(JSON.stringify({scripts:p.scripts,workspaces:p.workspaces,files:p.files,bin:p.bin,engines:p.engines},null,2))'
            echo "== per-workspace scripts =="
            for ws in $(node -e 'console.log(require("./package.json").workspaces.join(" "))'); do
              echo "-- $ws"
              node -e "console.log(JSON.stringify(require('./$ws/package.json').scripts,null,2))"
            done
            echo "== build outputs =="
            find packages -maxdepth 3 -name dist -type d -print 2>/dev/null || echo "(none)"
          } > diagnostics.txt
          mkdir -p npm-logs
          cp -r "$HOME/.npm/_logs/." npm-logs/ 2>/dev/null || true

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            diagnostics.txt
            npm-logs/
          if-no-files-found: ignore
          retention-days: 7

  # Browser E2E for the web UI (packages/web/e2e): real server + scripted
  # provider in memory mode with a fixed token, driven by Playwright in
  # Chromium. Covers the auth flow (wrong token, fragment token, bearer on
  # every request incl. SSE reconnects with Last-Event-ID), session creation
  # and root refusal, streamed turns, Stop, provider failure, approvals
  # (approve/deny) and project trust (refuse → grant → run → revoke); the B2
  # specs add the provider workspace journey (providers-workspace), the
  # /dashboard compatibility entry (dashboard), and accessibility semantics of
  # the B2 routes (accessibility).
  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ci]
    env:
      # See the note in the ci job: no Electron binary needed here.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: packages/web

      # B2 browser contract: the specs the merge gate depends on must exist and
      # stay discovered by the runner. Deleting or renaming one fails here
      # instead of silently shrinking coverage to green.
      - name: Enforce B2 browser contract inventory
        working-directory: packages/web
        shell: bash
        run: |
          for spec in ui workspace dashboard providers-workspace accessibility deep-routes responsive model-discovery; do
            test -f "e2e/${spec}.spec.ts" || { echo "::error::B2 browser contract: e2e/${spec}.spec.ts is missing"; exit 1; }
          done
          npx playwright test --list > spec-list.txt
          # Lines look like `  [chromium] › dashboard.spec.ts:33:3 › …` (paths
          # are testDir-relative); anchor on `› name.spec.ts:` so `workspace`
          # cannot match `providers-workspace`.
          for spec in dashboard providers-workspace accessibility deep-routes responsive model-discovery; do
            grep -qE "› ${spec}\.spec\.ts:" spec-list.txt || { echo "::error::B2 browser contract: playwright discovers no tests in ${spec}.spec.ts"; exit 1; }
          done
          echo "B2 browser contract inventory OK:"
          cat spec-list.txt

      - name: Run browser E2E
        run: npm run e2e
        env:
          CI: "1"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            packages/web/playwright-report/
            packages/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Builds the multi-stage image and runs the exact user path
  # (`docker compose up --build`) against the self-contained server bundle,
  # closing the last unverified part of G-06 on Linux. Runs after `ci` so a
  # broken build fails fast without spending minutes on a Docker build.
  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ci]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Exercises the Dockerfile builder (npm run build, bundle guard) and the
      # runtime stage (node on dist/index.cjs, no node_modules), plus the
      # compose topology: loopback-published port, /work mount, data volume.
      - name: Build and start the compose stack
        run: docker compose up --build -d

      - name: Wait for a healthy server
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:7634/healthz > /dev/null 2>&1; then
              echo "healthz answered after ~$((i * 2))s"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:7634/healthz | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('status')=='ok', d; print('healthz:', d)"
          # The API is authenticated: without the token /api is 401; the token
          # the first boot generated lives in the data volume.
          code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:7634/api/health)"
          test "$code" = "401" || { echo "expected 401 without a token, got $code"; exit 1; }
          token="$(docker compose exec -T windows-runner cat /home/node/.windows-runner/auth-token | tr -d '\r\n')"
          test -n "$token" || { echo "no auth-token in the data volume"; exit 1; }
          echo "WR_TOKEN=$token" >> "$GITHUB_ENV"
          echo "::add-mask::$token"
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:7634/api/health | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('status')=='ok', d; assert (d.get('persistence') or {}).get('mode')=='file', d; assert (d.get('security') or {}).get('mode')=='token', d; print('api/health: status ok, persistence file, auth token')"

      # One mock turn end to end inside the container: POST /turns with a cwd
      # inside the mounted workspace, follow SSE to the terminal event (the
      # server closes the stream there), assert the [mock] echo.
      - name: Run a mock turn over SSE
        shell: bash
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          base = "http://127.0.0.1:7634"
          auth = {"Authorization": "Bearer " + os.environ["WR_TOKEN"]}
          req = urllib.request.Request(
              f"{base}/api/sessions/docker-ci/turns",
              data=json.dumps({"cwd": "/work", "message": "docker ci turn"}).encode(),
              headers={"Content-Type": "application/json", **auth}, method="POST")
          with urllib.request.urlopen(req, timeout=120) as res:
              assert res.status == 202, res.status
              turn_id = json.load(res)["turnId"]
          assert turn_id, "no turnId returned"
          with urllib.request.urlopen(urllib.request.Request(f"{base}/api/sessions/docker-ci/turns/{turn_id}/events", headers=auth), timeout=120) as res:
              raw = res.read().decode()
          assert "turn_completed" in raw, raw[-2000:]
          assert "[mock]" in raw and "docker ci turn" in raw, raw[-2000:]
          print(f"turn {turn_id}: completed, mock reply echoed")
          EOF

      # SIGTERM must drain the server and exit 0, mirroring
      # scripts/smoke-start.mjs from the checkout path.
      - name: Stop the stack and assert a clean exit
        shell: bash
        run: |
          # Capture the id first: `compose ps` lists running containers only,
          # so it returns nothing once the container is stopped.
          cid="$(docker compose ps -q windows-runner)"
          test -n "${cid}"
          docker compose stop --timeout 30 windows-runner
          code="$(docker inspect "${cid}" --format '{{.State.ExitCode}}')"
          echo "container ${cid} exit code: ${code}"
          test "${code}" = "0"

      - name: Collect container diagnostics
        if: failure()
        shell: bash
        run: |
          docker compose logs --no-color --timestamps > docker-logs.txt 2>&1 || true
          docker inspect "$(docker compose ps -q --all windows-runner)" > docker-inspect.json 2>&1 || true

      - name: Upload container diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-diagnostics
          path: |
            docker-logs.txt
            docker-inspect.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down the stack
        if: always()
        run: docker compose down -v

  # Windows/macOS validation (gap G-06): the lifecycle, the packed-tarball and
  # startup smokes, and the native installer scripts, where shells, installers
  # and path behavior differ from Linux. Runs after `ci` so a broken build
  # fails fast; fail-fast is off so one OS result never hides the other.
  platform:
    name: Platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: [ci]
    env:
      # See the note in the ci job: no Electron binary needed here (covers the
      # nested `npm run setup` install inside install.sh / install.ps1 too).
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Same pin as the Linux job: one exact version everywhere until the
          # supported-range decision (RELEASE_CHECKLIST.md, step 3) lands.
          node-version: "22.23.2"
          cache: npm

      - name: Install dependencies (clean, lockfile-driven)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        id: test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "test-${{ matrix.os }}.log"

      - name: Packed-artifact smoke test
        shell: bash
        run: |
          set -o pipefail
          npm run smoke:packed 2>&1 | tee smoke-packed.log

      - name: Packed-tarball start smoke test
        shell: bash
        run: |
          set -o pipefail
          npm run smoke:packed:start 2>&1 | tee smoke-packed-start.log

      - name: Startup smoke test
        shell: bash
        run: |
          set -o pipefail
          npm run smoke:start 2>&1 | tee smoke-start.log

      # Exercises the Unix installer end to end in checkout mode (prerequisite
      # checks, checkout detection, `npm run setup` orchestration). --no-start
      # skips the interactive offer; there is no TTY under CI.
      - name: Run install.sh in checkout mode
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          bash install.sh --no-start 2>&1 | tee installer.log

      # Same for the Windows installer. -ExecutionPolicy Bypass is CI-only
      # plumbing so the script is guaranteed to execute; it validates the
      # script logic, not the policy UX (see docs/INSTALL.md troubleshooting).
      - name: Run install.ps1 in checkout mode
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -NoStart 2>&1 | Tee-Object -FilePath installer.log
          exit $LASTEXITCODE

      # Surfaces the failure from the most recent step log as run annotations (and
      # keeps every step log in the diagnostics artifact), so a red matrix leg
      # is diagnosable without downloading and grepping the whole log. The last
      # log written is the failed step's, because later steps are skipped.
      - name: Report failure output
        if: failure()
        shell: bash
        run: |
          latest="$(ls -t *.log 2>/dev/null | head -n 1)"
          if [ -z "${latest}" ]; then
            echo "no step logs captured"
            exit 0
          fi
          echo "===== ${latest} (tail) ====="
          tail -n 40 "${latest}"
          # TAP suites: the failing test names. Anything else (smokes,
          # installers): the trailing lines, where the error summary lives.
          if grep -q "not ok" "${latest}"; then
            grep -E "not ok" "${latest}" | head -n 10 | while IFS= read -r line; do
              clean="$(printf '%s' "${line}" | sed -e 's/%/%25/g' -e 's/:/%3A/g' -e 's/\r//g' | cut -c1-500)"
              echo "::error title=${latest}::${clean}"
            done
          else
            tail -n 12 "${latest}" | while IFS= read -r line; do
              clean="$(printf '%s' "${line}" | sed -e 's/%/%25/g' -e 's/:/%3A/g' -e 's/\r//g' | cut -c1-500)"
              [ -n "${clean}" ] || continue
              echo "::error title=${latest}::${clean}"
            done
          fi

      - name: Collect diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo "== os =="
            uname -a 2>/dev/null || systeminfo 2>/dev/null | head -n 5
            echo "== node =="
            node --version
            echo "== npm =="
            npm --version
            echo "== git =="
            git --version
            echo "== git status =="
            git status --short
          } > "diagnostics-${{ matrix.os }}.txt"
          mkdir -p npm-logs
          cp -r "$HOME/.npm/_logs/." npm-logs/ 2>/dev/null || cp -r "$APPDATA/npm-cache/_logs/." npm-logs/ 2>/dev/null || true

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: platform-diagnostics-${{ matrix.os }}
          path: |
            diagnostics-${{ matrix.os }}.txt
            test-${{ matrix.os }}.log
            smoke-packed.log
            smoke-packed-start.log
            smoke-start.log
            installer.log
            npm-logs/
          if-no-files-found: ignore
          retention-days: 7

  # Desktop shell (PR A / A2): the real Electron binary against the bundled
  # server. `smoke:electron` is the first real execution of that suite (the
  # authoring sandbox cannot download the Electron binary — the download hosts
  # are network-blocked — so in-sandbox coverage was `smoke:page` + unit
  # tests, honest substitutes); `e2e` runs the merge-gate user journey
  # (boot -> auto-auth -> mock turn -> clean shutdown) against the unpacked
  # app. The installer job below repeats the journey against the INSTALLED app.
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [ci]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm

      # Deliberately no ELECTRON_SKIP_BINARY_DOWNLOAD: the Electron binary
      # download is the point of this job.
      - name: Install dependencies (clean, lockfile-driven)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build the desktop shell
        run: npm run build:desktop

      - name: Typecheck the desktop workspace
        run: npm run typecheck:desktop

      - name: Desktop unit tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:desktop 2>&1 | tee test-desktop.log

      # @sparticuz/chromium ships an ELF binary: Linux only.
      - name: Page smoke (real headless Chromium at /desktop)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          npm run smoke:page --workspace packages/desktop 2>&1 | tee smoke-page.log

      # Electron opens windows; on Linux CI that needs a display. `xvfb-run -a`
      # provides a virtual one (the ozone headless route hung the Electron
      # launch handshake on ubuntu-latest; xvfb is the battle-tested path).
      - name: Electron smoke (real unpacked Electron)
        shell: bash
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run smoke:electron --workspace packages/desktop 2>&1 | tee smoke-electron.log
          else
            npm run smoke:electron --workspace packages/desktop 2>&1 | tee smoke-electron.log
          fi

      # B2 desktop contract: the core journey and the provider/settings journey
      # both ship — in this job against the unpacked app, and in the installer
      # job against the installed one (`npm run e2e` runs every spec).
      - name: Enforce B2 desktop contract inventory
        shell: bash
        run: |
          for spec in desktop providers deep-routes; do
            test -f "packages/desktop/e2e/${spec}.spec.ts" || { echo "::error::B2 desktop contract: e2e/${spec}.spec.ts is missing"; exit 1; }
          done
          # B5 addition: the upgrade journey spec must ship too (it runs in the
          # installer job; here it self-skips without its env contract).
          test -f "packages/desktop/e2e/upgrade.spec.ts" || { echo "::error::B5 desktop contract: e2e/upgrade.spec.ts is missing"; exit 1; }
          echo "B2 desktop contract inventory OK"

      - name: "Desktop e2e (user journey - boot -> mock turn -> clean shutdown)"
        shell: bash
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run e2e --workspace packages/desktop 2>&1 | tee e2e-desktop.log
          else
            npm run e2e --workspace packages/desktop 2>&1 | tee e2e-desktop.log
          fi
        env:
          CI: "1"

      - name: Report failure output
        if: failure()
        shell: bash
        run: |
          latest="$(ls -t *.log 2>/dev/null | head -n 1)"
          if [ -z "${latest}" ]; then
            echo "no step logs captured"
            exit 0
          fi
          echo "===== ${latest} (tail) ====="
          tail -n 40 "${latest}"
          if grep -q "not ok" "${latest}"; then
            grep -E "not ok" "${latest}" | head -n 10 | while IFS= read -r line; do
              clean="$(printf '%s' "${line}" | sed -e 's/%/%25/g' -e 's/:/%3A/g' -e 's/\r//g' | cut -c1-500)"
              echo "::error title=${latest}::${clean}"
            done
          else
            tail -n 12 "${latest}" | while IFS= read -r line; do
              clean="$(printf '%s' "${line}" | sed -e 's/%/%25/g' -e 's/:/%3A/g' -e 's/\r//g' | cut -c1-500)"
              [ -n "${clean}" ] || continue
              echo "::error title=${latest}::${clean}"
            done
          fi

      - name: Collect diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo "== os =="
            uname -a 2>/dev/null || systeminfo 2>/dev/null | head -n 5
            echo "== node =="
            node --version
            echo "== electron dist =="
            ls node_modules/electron/dist 2>/dev/null | head || echo "(no electron dist)"
            echo "== desktop dist =="
            find packages/desktop/dist -maxdepth 2 -type f 2>/dev/null | head -n 20 || true
          } > "diagnostics-desktop-${{ matrix.os }}.txt"

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-diagnostics-${{ matrix.os }}
          path: |
            diagnostics-desktop-${{ matrix.os }}.txt
            *.log
            packages/desktop/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # The A2 merge gate (extended by B5): build the NSIS installer, install it
  # silently on a clean Windows runner, drive the INSTALLED app through the
  # user journey (boot -> auto-auth -> mock turn -> clean shutdown), then
  # verify the UPGRADE story: seed real user data with the current version,
  # install a patch-bumped build over it, assert the version took and the data
  # survived, and finally uninstall silently — asserting the app is gone AND
  # user data outlives the uninstall (deleteAppDataOnUninstall: false). The
  # installer exe is uploaded as a workflow artifact so a human can install
  # exactly what CI proved.
  desktop-installer:
    name: Desktop installer (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [desktop]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Install dependencies (clean, lockfile-driven)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build the desktop shell
        run: npm run build:desktop

      - name: Build the NSIS installer
        shell: bash
        run: npm run package:desktop:win

      # B5.4 — every installer artifact ships with a checksum sidecar so users
      # can verify integrity (docs/INSTALL.md -> "Verifying a download").
      - name: Publish SHA-256 checksums for the installer artifacts
        shell: bash
        run: |
          cd packages/desktop/release
          node ../../../scripts/checksums.mjs --out . *-Setup-*.exe latest.yml
          echo "SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: windowrunner-installer
          path: |
            packages/desktop/release/*-Setup-*.exe
            packages/desktop/release/latest.yml
            packages/desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: "Install silently (per-user, no UAC) and assert the app is present"
        shell: pwsh
        run: |
          $setup = Get-ChildItem packages\desktop\release\*-Setup-*.exe | Select-Object -First 1
          if (!$setup) { throw "no installer produced" }
          Write-Host "installing $($setup.FullName)"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -PassThru -Wait
          Write-Host "installer exit code: $($p.ExitCode)"
          # The canonical product path — a product contract, not a search
          # (pinned in packages/desktop/test/packaging.test.ts).
          $exe = Join-Path $env:LOCALAPPDATA "Programs\WindowRunner\WindowRunner.exe"
          $dir = Split-Path $exe
          # One-click installers can return before files settle: poll.
          for ($i = 0; $i -lt 60; $i++) {
            if (Test-Path $exe) { break }
            Start-Sleep -Seconds 1
          }
          if (!(Test-Path $exe)) {
            $listing = if (Test-Path $dir) { (Get-ChildItem $dir | ForEach-Object Name) -join ", " } else { "(install dir missing)" }
            $programs = (Get-ChildItem (Join-Path $env:LOCALAPPDATA "Programs") -ErrorAction SilentlyContinue | ForEach-Object Name) -join ", "
            Write-Host "::error title=install diagnostics::installer exit=$($p.ExitCode); expected $exe; dir=[$listing]; LOCALAPPDATA\Programs=[$programs]"
            throw "installed executable not found at $exe"
          }
          Write-Host "ASSERT PASS: silent install verified — WindowRunner.exe present at $exe"
          Write-Host "::notice title=installer gate::ASSERT PASS: silent install verified — WindowRunner.exe present at $exe"
          "WR_ELECTRON_EXECUTABLE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          # B5.6 upgrade journey anchors: the REAL per-user data location for
          # the installed app, a marker project dir, and the current version.
          "WR_APPDATA_DIR=$(Join-Path $env:APPDATA 'WindowRunner')" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WR_UPGRADE_MARKER_DIR=$(Join-Path $env:RUNNER_TEMP 'wr-upgrade-marker')" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WR_CURRENT_VERSION=$(node -p "require('./package.json').version")" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: "E2E against the installed app (boot -> auto-auth -> mock turn -> clean shutdown)"
        shell: bash
        run: npm run e2e --workspace packages/desktop
        env:
          CI: "1"

      # B5.6 — in-place upgrade journey, phase A: seed real user data (a
      # project in the workspace catalog, a session with a completed turn)
      # with the CURRENT version, at the REAL per-user data location.
      - name: "Upgrade phase A: seed user data with the current version"
        shell: bash
        run: npm run e2e --workspace packages/desktop -- upgrade.spec.ts
        env:
          CI: "1"
          WR_UPGRADE_PHASE: old
          WR_EXPECTED_APP_VERSION: ${{ env.WR_CURRENT_VERSION }}
          WR_UPGRADE_DATA_DIR: ${{ env.WR_APPDATA_DIR }}
          WR_UPGRADE_MARKER_DIR: ${{ env.WR_UPGRADE_MARKER_DIR }}

      # Build the upgrade target: the same tree, a patch-bumped version
      # (electron-builder -c.extraMetadata.version), into a separate output
      # dir so the current-version artifacts above stay untouched.
      - name: "Build the next-version installer (upgrade target)"
        shell: bash
        run: |
          NEXT=$(node -p "const p=require('./package.json').version.split('.').map(Number); p[2]+=1; p.join('.')")
          echo "upgrade target version: $NEXT"
          echo "WR_NEXT_VERSION=$NEXT" >> "$GITHUB_ENV"
          cd packages/desktop
          npx electron-builder --win nsis --config electron-builder.yml -c.extraMetadata.version="$NEXT" -c.directories.output=release-next

      - name: "Install the next version over the old one (in-place upgrade)"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Get-ChildItem packages\desktop\release-next\*-Setup-*.exe | Select-Object -First 1
          if (!$setup) { throw "no upgrade installer produced in release-next" }
          Write-Host "installing upgrade $($setup.FullName)"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -PassThru -Wait
          Write-Host "upgrade installer exit code: $($p.ExitCode)"
          $exe = Join-Path $env:LOCALAPPDATA "Programs\WindowRunner\WindowRunner.exe"
          for ($i = 0; $i -lt 60; $i++) {
            if (Test-Path $exe) { break }
            Start-Sleep -Seconds 1
          }
          if (!(Test-Path $exe)) { throw "upgraded executable not found at $exe" }
          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "installed exe ProductVersion: $productVersion (expected $($env:WR_NEXT_VERSION))"
          if ($productVersion -ne $env:WR_NEXT_VERSION) {
            throw "in-place upgrade did not take: exe ProductVersion is $productVersion, expected $($env:WR_NEXT_VERSION)"
          }
          Write-Host "ASSERT PASS: in-place upgrade verified — exe now at $productVersion"
          Write-Host "::notice title=installer gate::ASSERT PASS: in-place upgrade to $productVersion over the previous install"

      # B5.6 — phase B: the upgraded app must still see the phase-A data and
      # still work (fresh turn), proving upgrades preserve user data.
      - name: "Upgrade phase B: user data survived the in-place upgrade"
        shell: bash
        run: npm run e2e --workspace packages/desktop -- upgrade.spec.ts
        env:
          CI: "1"
          WR_UPGRADE_PHASE: new
          WR_EXPECTED_APP_VERSION: ${{ env.WR_NEXT_VERSION }}
          WR_UPGRADE_DATA_DIR: ${{ env.WR_APPDATA_DIR }}
          WR_UPGRADE_MARKER_DIR: ${{ env.WR_UPGRADE_MARKER_DIR }}

      - name: "Uninstall silently, assert the app is removed AND user data survives"
        shell: pwsh
        run: |
          # Same canonical product path as the install assertion.
          $exe = Join-Path $env:LOCALAPPDATA "Programs\WindowRunner\WindowRunner.exe"
          $dir = Split-Path $exe
          $un = Get-ChildItem $dir -Filter "Uninstall*.exe" | Select-Object -First 1
          if (!$un) { throw "uninstaller not found in $dir" }
          Write-Host "uninstalling $($un.FullName)"
          Start-Process -FilePath $un.FullName -ArgumentList "/S" -Wait
          for ($i = 0; $i -lt 60; $i++) {
            if (!(Test-Path $exe)) { break }
            Start-Sleep -Seconds 1
          }
          if (Test-Path $exe) { throw "uninstall left $exe behind" }
          Write-Host "ASSERT PASS: silent uninstall verified — WindowRunner.exe removed from $dir"
          Write-Host "::notice title=installer gate::ASSERT PASS: silent uninstall verified — WindowRunner.exe removed from $dir"
          # B5.6: the documented contract is deleteAppDataOnUninstall: false —
          # user data must SURVIVE uninstall (docs/INSTALL.md). Assert it on
          # the real per-user location, using the catalog the upgrade journey
          # seeded (also proves the catalog was not silently wiped).
          $catalog = Join-Path $env:APPDATA "WindowRunner\workspace-catalog.json"
          if (!(Test-Path $catalog)) { throw "uninstall removed user data: $catalog is gone (deleteAppDataOnUninstall must stay false)" }
          Write-Host "ASSERT PASS: user data survived uninstall — $catalog still present"
          Write-Host "::notice title=installer gate::ASSERT PASS: user data survived uninstall"
          # Runner hygiene: the seeded data has served its purpose.
          Remove-Item -Recurse -Force (Join-Path $env:APPDATA "WindowRunner") -ErrorAction SilentlyContinue

      - name: Collect installer diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo "== release dir =="
            ls -la packages/desktop/release 2>/dev/null || true
            echo "== release-next dir (upgrade target) =="
            ls -la packages/desktop/release-next 2>/dev/null || true
            echo "== install dir =="
            ls -la "$LOCALAPPDATA/Programs/WindowRunner" 2>/dev/null || true
            echo "== app data dir =="
            ls -la "$APPDATA/WindowRunner" 2>/dev/null || true
            echo "== app data server log =="
            tail -n 50 "$APPDATA/WindowRunner/logs/server.log" 2>/dev/null || echo "(none)"
          } > installer-diagnostics.txt

      - name: Upload installer diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installer-diagnostics
          path: |
            installer-diagnostics.txt
            packages/desktop/release/*-Setup-*.exe
            packages/desktop/release/latest.yml
            packages/desktop/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # B5.3 — proves the code-signing pipeline on every PR. Generates a
  # self-signed CodeSigningCert on the runner (exported to a PFX — the exact
  # shape a production WIN_CSC_LINK secret provides), builds the installer
  # with forceCodeSigning, and asserts the produced artifacts carry an
  # Authenticode signature from that certificate.
  #
  # What this job does NOT prove: trust. A self-signed chain is untrusted by
  # any customer machine (Get-AuthenticodeSignature reports UnknownError, not
  # Valid) — the assertion below is "signed by the pipeline", which is the
  # part that can regress in this repository. Production trust (SmartScreen
  # reputation) comes from a real OV/EV certificate wired through the same
  # WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD secrets in the release workflow; see
  # docs/INSTALL.md -> "Code signing and SmartScreen".
  desktop-signing:
    name: Desktop signing (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [desktop]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm

      # Deliberately no ELECTRON_SKIP_BINARY_DOWNLOAD: the packaging step
      # needs the Electron runtime to build the installer.
      - name: Install dependencies (clean, lockfile-driven)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build the desktop shell
        run: npm run build:desktop

      # Throwaway certificate: valid a few hours, private key never leaves the
      # runner (CurrentUser store -> PFX under RUNNER_TEMP, store entry removed
      # immediately after export). The password is not a secret — the artifact
      # it protects is destroyed with the runner.
      - name: Generate a self-signed code-signing test certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $password = "wr-ci-signing-proof"
          $secure = ConvertTo-SecureString -String $password -Force -AsPlainText
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=WindowRunner CI Signing Proof" -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddHours(4)
          try {
            $pfx = $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Pfx, $password)
            [System.IO.File]::WriteAllBytes("$env:RUNNER_TEMP\wr-ci-signing-proof.pfx", $pfx)
          } finally {
            Remove-Item -Path "Cert:\CurrentUser\My\$($cert.Thumbprint)" -ErrorAction SilentlyContinue
          }
          Write-Host "test certificate exported (thumbprint $($cert.Thumbprint), expires $($cert.NotAfter.ToString('u')))"
          "WR_CI_PFX=$env:RUNNER_TEMP\wr-ci-signing-proof.pfx" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ELECTRON_BUILDER_OFFLINE=true: skip the RFC 3161 timestamp server —
      # the throwaway certificate needs no counter-signature, and the proof
      # must not depend on an external timestamp service. Release builds with
      # a real certificate DO timestamp (electron-builder default server).
      - name: Build the installer signed (forceCodeSigning, test certificate)
        shell: bash
        env:
          WIN_CSC_LINK: ${{ env.WR_CI_PFX }}
          WIN_CSC_KEY_PASSWORD: wr-ci-signing-proof
          ELECTRON_BUILDER_OFFLINE: "true"
        run: npm run package:desktop:win:release

      - name: "Assert the app executable and the installer are signed"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "packages\desktop\release\win-unpacked\WindowRunner.exe"
          $setup = Get-ChildItem "packages\desktop\release" -Filter "*-Setup-*.exe" | Select-Object -First 1
          if (!$setup) { throw "no installer produced" }
          foreach ($file in @($exe, $setup.FullName)) {
            if (!(Test-Path $file)) { throw "missing build output: $file" }
            $sig = Get-AuthenticodeSignature -FilePath $file
            Write-Host "$file -> status=$($sig.Status) signer=$($sig.SignerCertificate.Subject)"
            if ($sig.Status -eq "NotSigned") {
              throw "NOT SIGNED: $file — the signing pipeline is broken (forceCodeSigning should have failed the build first)"
            }
            if ($sig.SignerCertificate -eq $null -or $sig.SignerCertificate.Subject -notmatch "WindowRunner CI Signing Proof") {
              throw "WRONG SIGNER: $file — signed by something other than the CI test certificate"
            }
          }
          Write-Host "ASSERT PASS: app exe and installer are Authenticode-signed by the pipeline test certificate (status 'UnknownError' is expected: the test chain is untrusted by design)"
          Write-Host "::notice title=signing gate::ASSERT PASS: installer + app exe signed by the CI test certificate"

      - name: Collect signing diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo "== release dir =="
            ls -la packages/desktop/release 2>/dev/null || true
            echo "== win-unpacked =="
            ls -la packages/desktop/release/win-unpacked 2>/dev/null | head -n 20 || true
          } > signing-diagnostics.txt

      # The test-signed installer is uploaded ONLY on failure, as a diagnostic.
      # It is signed by an untrusted throwaway certificate and must never be
      # mistaken for a releasable artifact.
      - name: Upload signing diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-signing-diagnostics
          path: |
            signing-diagnostics.txt
            packages/desktop/release/*-Setup-*.exe
            packages/desktop/release/latest.yml
          if-no-files-found: ignore
          retention-days: 7
