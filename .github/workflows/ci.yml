name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned exact version: Node 20 is EOL (security fixes ended 2026-04-30);
          # Node 22 is Active LTS and satisfies the repo's engines (>=20.10).
          node-version: "22.23.2"
          cache: npm

      # A plain `npm ci`, with no --ignore-scripts: the root package.json declares
      # `postinstall: node scripts/postinstall.mjs`, and that script now exists and
      # verifies the workspace tree. An earlier revision of this workflow had to
      # skip lifecycle scripts because scripts/ was absent from main, which meant
      # CI could not tell a healthy install from a broken one. Running the hook is
      # the point of this step. See docs/INSTALL.md.
      - name: Install dependencies (clean, lockfile-driven)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Asserts the packed tarball matches the manifest contract: dist/ only, no
      # sources, no tests, and bin points to existing files.
      - name: Packed-artifact smoke test
        run: npm run smoke:packed

      # Unpacks the packed tarball in an isolated directory outside the source
      # tree and verifies that `npm start` boots and serves health requests.
      - name: Packed-tarball start smoke test
        run: npm run smoke:packed:start

      # Boots the compiled server (packages/server/dist/index.cjs) as a child
      # process in file-persistence mode against a temp data dir, runs a turn
      # through the offline mock provider over SSE, restarts it to check
      # recovery, and asserts a clean exit on SIGTERM.
      - name: Startup smoke test
        run: npm run smoke:start

      # Evaluation harness in scripted mode: real server + openai-compatible
      # adapter + built-in tools + approvals, driven by scripted "model"
      # solutions against a fake OpenAI endpoint. No key, no network. Proves
      # the harness and the tool path end to end; real-model runs are manual
      # (eval/README.md) and never part of CI.
      - name: Evaluation harness (scripted, no keys)
        run: npm run eval -- --expect-pass --out eval-scripted.json

      - name: Collect diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo "== node =="
            node --version
            echo "== npm =="
            npm --version
            echo "== git =="
            git --version
            echo "== git status =="
            git status --short
            echo "== workspace manifests =="
            node -e 'const p=require("./package.json");console.log(JSON.stringify({scripts:p.scripts,workspaces:p.workspaces,files:p.files,bin:p.bin,engines:p.engines},null,2))'
            echo "== per-workspace scripts =="
            for ws in $(node -e 'console.log(require("./package.json").workspaces.join(" "))'); do
              echo "-- $ws"
              node -e "console.log(JSON.stringify(require('./$ws/package.json').scripts,null,2))"
            done
            echo "== build outputs =="
            find packages -maxdepth 3 -name dist -type d -print 2>/dev/null || echo "(none)"
          } > diagnostics.txt
          mkdir -p npm-logs
          cp -r "$HOME/.npm/_logs/." npm-logs/ 2>/dev/null || true

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            diagnostics.txt
            npm-logs/
          if-no-files-found: ignore
          retention-days: 7

  # Browser E2E for the web UI (packages/web/e2e): real server + scripted
  # provider in memory mode with a fixed token, driven by Playwright in
  # Chromium. Covers the auth flow (wrong token, fragment token, bearer on
  # every request incl. SSE reconnects with Last-Event-ID), session creation
  # and root refusal, streamed turns, Stop, provider failure, approvals
  # (approve/deny) and project trust (refuse → grant → run → revoke).
  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ci]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: packages/web

      - name: Run browser E2E
        run: npm run e2e
        env:
          CI: "1"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            packages/web/playwright-report/
            packages/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Builds the multi-stage image and runs the exact user path
  # (`docker compose up --build`) against the self-contained server bundle,
  # closing the last unverified part of G-06 on Linux. Runs after `ci` so a
  # broken build fails fast without spending minutes on a Docker build.
  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ci]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Exercises the Dockerfile builder (npm run build, bundle guard) and the
      # runtime stage (node on dist/index.cjs, no node_modules), plus the
      # compose topology: loopback-published port, /work mount, data volume.
      - name: Build and start the compose stack
        run: docker compose up --build -d

      - name: Wait for a healthy server
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:7634/healthz > /dev/null 2>&1; then
              echo "healthz answered after ~$((i * 2))s"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:7634/healthz | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('status')=='ok', d; print('healthz:', d)"
          # The API is authenticated: without the token /api is 401; the token
          # the first boot generated lives in the data volume.
          code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:7634/api/health)"
          test "$code" = "401" || { echo "expected 401 without a token, got $code"; exit 1; }
          token="$(docker compose exec -T windows-runner cat /home/node/.windows-runner/auth-token | tr -d '\r\n')"
          test -n "$token" || { echo "no auth-token in the data volume"; exit 1; }
          echo "WR_TOKEN=$token" >> "$GITHUB_ENV"
          echo "::add-mask::$token"
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:7634/api/health | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('status')=='ok', d; assert (d.get('persistence') or {}).get('mode')=='file', d; assert (d.get('security') or {}).get('mode')=='token', d; print('api/health: status ok, persistence file, auth token')"

      # One mock turn end to end inside the container: POST /turns with a cwd
      # inside the mounted workspace, follow SSE to the terminal event (the
      # server closes the stream there), assert the [mock] echo.
      - name: Run a mock turn over SSE
        shell: bash
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          base = "http://127.0.0.1:7634"
          auth = {"Authorization": "Bearer " + os.environ["WR_TOKEN"]}
          req = urllib.request.Request(
              f"{base}/api/sessions/docker-ci/turns",
              data=json.dumps({"cwd": "/work", "message": "docker ci turn"}).encode(),
              headers={"Content-Type": "application/json", **auth}, method="POST")
          with urllib.request.urlopen(req, timeout=120) as res:
              assert res.status == 202, res.status
              turn_id = json.load(res)["turnId"]
          assert turn_id, "no turnId returned"
          with urllib.request.urlopen(urllib.request.Request(f"{base}/api/sessions/docker-ci/turns/{turn_id}/events", headers=auth), timeout=120) as res:
              raw = res.read().decode()
          assert "turn_completed" in raw, raw[-2000:]
          assert "[mock]" in raw and "docker ci turn" in raw, raw[-2000:]
          print(f"turn {turn_id}: completed, mock reply echoed")
          EOF

      # SIGTERM must drain the server and exit 0, mirroring
      # scripts/smoke-start.mjs from the checkout path.
      - name: Stop the stack and assert a clean exit
        shell: bash
        run: |
          # Capture the id first: `compose ps` lists running containers only,
          # so it returns nothing once the container is stopped.
          cid="$(docker compose ps -q windows-runner)"
          test -n "${cid}"
          docker compose stop --timeout 30 windows-runner
          code="$(docker inspect "${cid}" --format '{{.State.ExitCode}}')"
          echo "container ${cid} exit code: ${code}"
          test "${code}" = "0"

      - name: Collect container diagnostics
        if: failure()
        shell: bash
        run: |
          docker compose logs --no-color --timestamps > docker-logs.txt 2>&1 || true
          docker inspect "$(docker compose ps -q --all windows-runner)" > docker-inspect.json 2>&1 || true

      - name: Upload container diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-diagnostics
          path: |
            docker-logs.txt
            docker-inspect.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down the stack
        if: always()
        run: docker compose down -v

  # Windows/macOS validation (gap G-06): the lifecycle, the packed-tarball and
  # startup smokes, and the native installer scripts, where shells, installers
  # and path behavior differ from Linux. Runs after `ci` so a broken build
  # fails fast; fail-fast is off so one OS result never hides the other.
  platform:
    name: Platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: [ci]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Same pin as the Linux job: one exact version everywhere until the
          # supported-range decision (RELEASE_CHECKLIST.md, step 3) lands.
          node-version: "22.23.2"
          cache: npm

      - name: Install dependencies (clean, lockfile-driven)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        id: test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "test-${{ matrix.os }}.log"

      - name: Packed-artifact smoke test
        shell: bash
        run: |
          set -o pipefail
          npm run smoke:packed 2>&1 | tee smoke-packed.log

      - name: Packed-tarball start smoke test
        shell: bash
        run: |
          set -o pipefail
          npm run smoke:packed:start 2>&1 | tee smoke-packed-start.log

      - name: Startup smoke test
        shell: bash
        run: |
          set -o pipefail
          npm run smoke:start 2>&1 | tee smoke-start.log

      # Exercises the Unix installer end to end in checkout mode (prerequisite
      # checks, checkout detection, `npm run setup` orchestration). --no-start
      # skips the interactive offer; there is no TTY under CI.
      - name: Run install.sh in checkout mode
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          bash install.sh --no-start 2>&1 | tee installer.log

      # Same for the Windows installer. -ExecutionPolicy Bypass is CI-only
      # plumbing so the script is guaranteed to execute; it validates the
      # script logic, not the policy UX (see docs/INSTALL.md troubleshooting).
      - name: Run install.ps1 in checkout mode
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -NoStart 2>&1 | Tee-Object -FilePath installer.log
          exit $LASTEXITCODE

      # Surfaces the failure from the most recent step log as run annotations (and
      # keeps every step log in the diagnostics artifact), so a red matrix leg
      # is diagnosable without downloading and grepping the whole log. The last
      # log written is the failed step's, because later steps are skipped.
      - name: Report failure output
        if: failure()
        shell: bash
        run: |
          latest="$(ls -t *.log 2>/dev/null | head -n 1)"
          if [ -z "${latest}" ]; then
            echo "no step logs captured"
            exit 0
          fi
          echo "===== ${latest} (tail) ====="
          tail -n 40 "${latest}"
          # TAP suites: the failing test names. Anything else (smokes,
          # installers): the trailing lines, where the error summary lives.
          if grep -q "not ok" "${latest}"; then
            grep -E "not ok" "${latest}" | head -n 10 | while IFS= read -r line; do
              clean="$(printf '%s' "${line}" | sed -e 's/%/%25/g' -e 's/:/%3A/g' -e 's/\r//g' | cut -c1-500)"
              echo "::error title=${latest}::${clean}"
            done
          else
            tail -n 12 "${latest}" | while IFS= read -r line; do
              clean="$(printf '%s' "${line}" | sed -e 's/%/%25/g' -e 's/:/%3A/g' -e 's/\r//g' | cut -c1-500)"
              [ -n "${clean}" ] || continue
              echo "::error title=${latest}::${clean}"
            done
          fi

      - name: Collect diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo "== os =="
            uname -a 2>/dev/null || systeminfo 2>/dev/null | head -n 5
            echo "== node =="
            node --version
            echo "== npm =="
            npm --version
            echo "== git =="
            git --version
            echo "== git status =="
            git status --short
          } > "diagnostics-${{ matrix.os }}.txt"
          mkdir -p npm-logs
          cp -r "$HOME/.npm/_logs/." npm-logs/ 2>/dev/null || cp -r "$APPDATA/npm-cache/_logs/." npm-logs/ 2>/dev/null || true

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: platform-diagnostics-${{ matrix.os }}
          path: |
            diagnostics-${{ matrix.os }}.txt
            test-${{ matrix.os }}.log
            smoke-packed.log
            smoke-packed-start.log
            smoke-start.log
            installer.log
            npm-logs/
          if-no-files-found: ignore
          retention-days: 7
