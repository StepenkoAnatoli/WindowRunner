# Release workflow (B5.7) — tag-driven artifact publication.
#
# Pushing a tag `vX.Y.Z` builds everything a release needs, proves it, and
# creates a DRAFT GitHub Release a human then reviews and publishes:
#
#   guard      — the tag must match package.json AND the changelog section
#                (check-release --require-version), plus the unit suite
#   cli        — the npm tarball, proven by the packed-artifact smokes
#   installer  — the NSIS installer, signed with the production certificate
#                when WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD secrets exist
#                (forceCodeSigning refuses to ship silently unsigned),
#                otherwise built unsigned and the draft carries a warning;
#                installed silently, driven through the desktop e2e journey,
#                uninstalled
#   release    — draft release with the installer, tarball, update metadata,
#                SHA256SUMS.txt and the changelog-derived notes
#
# Draft, never publish: publishing is a human action. Until the signing
# secrets exist the draft is explicitly marked unsigned (SmartScreen will
# warn on the installer — see docs/INSTALL.md → "Code signing and SmartScreen").
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Guard (tag matches the tree)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Install dependencies (clean, lockfile-driven)
        run: npm ci

      # Binds the tag to the tree: the tagged version must equal the
      # package.json version and must have a changelog section.
      - name: Release consistency gate (tag-bound)
        run: npm run check:release -- --require-version "${GITHUB_REF_NAME}"

      # The unit suite includes the server packaging contract, which copies
      # and runs the built bundle (packages/server/dist/index.cjs) in an
      # isolated directory. A fresh checkout has no dist/ (gitignored, and
      # postinstall deliberately does not build), so the guard must build
      # before `npm test` — the same order as the CI job. Without this the
      # very first tag push (v0.1.0) failed in the guard: the packaging test
      # asserted the bundle exists on a tree that had never been built.
      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

  cli:
    name: CLI tarball
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [guard]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Install dependencies (clean, lockfile-driven)
        run: npm ci

      - name: Build
        run: npm run build

      # The tarball must be what the manifest claims, and must boot from a
      # clean directory outside the repository, before it is shipped.
      - name: Packed-artifact smoke test
        run: npm run smoke:packed

      - name: Packed-tarball start smoke test
        run: npm run smoke:packed:start

      - name: Pack the release tarball
        run: |
          npm pack
          mkdir -p release-cli
          mv windows-runner-*.tgz release-cli/

      - name: Upload the CLI tarball
        uses: actions/upload-artifact@v4
        with:
          name: release-cli
          path: release-cli/*.tgz
          if-no-files-found: error
          retention-days: 7

  installer:
    name: Installer (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 40
    needs: [guard]
    outputs:
      signed: ${{ steps.signing.outputs.mode == 'signed' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Install dependencies (clean, lockfile-driven)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build the desktop shell
        run: npm run build:desktop

      # Production signing is credential-driven (same as CI's signing-proof
      # job, but with the real certificate): when the secrets exist the build
      # runs with forceCodeSigning and cannot ship unsigned; when they do not,
      # the build is unsigned and the draft release carries an explicit
      # warning. One config, no code changes — adding the secrets flips it.
      # The secret itself is never interpolated into shell code — only the
      # yes/no decision crosses the step boundary (HAS_CERT env).
      #
      # The decision tests BOTH secrets because the build consumes both:
      # electron-builder needs WIN_CSC_LINK for the certificate and
      # WIN_CSC_KEY_PASSWORD to open it. Testing only the link meant a
      # half-configured repository took the forceCodeSigning path and failed
      # the build with an opaque signing error, instead of reporting the one
      # missing secret — which is the diagnostic this step exists to produce.
      - name: Decide the signing mode
        id: signing
        shell: bash
        env:
          HAS_CERT: ${{ secrets.WIN_CSC_LINK != '' && secrets.WIN_CSC_KEY_PASSWORD != '' && 'yes' || 'no' }}
          HAS_LINK: ${{ secrets.WIN_CSC_LINK != '' && 'yes' || 'no' }}
          HAS_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD != '' && 'yes' || 'no' }}
        run: |
          if [ "$HAS_CERT" = "yes" ]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_LINK" = "yes" ]; then
            # Half-configured: the certificate is present but cannot be opened.
            # Say exactly which secret is missing rather than letting
            # forceCodeSigning fail the build without naming it.
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "::error title=signing misconfigured::WIN_CSC_LINK is set but WIN_CSC_KEY_PASSWORD is not, so the certificate cannot be opened. Add the WIN_CSC_KEY_PASSWORD repository secret. Building UNSIGNED for this run."
          elif [ "$HAS_PASSWORD" = "yes" ]; then
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "::error title=signing misconfigured::WIN_CSC_KEY_PASSWORD is set but WIN_CSC_LINK is not, so there is no certificate to sign with. Add the WIN_CSC_LINK repository secret. Building UNSIGNED for this run."
          else
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "::warning title=unsigned release build::WIN_CSC_LINK is not configured — the installer will be built UNSIGNED and the draft release will say so."
          fi

      - name: Build the installer (signed, forceCodeSigning)
        if: steps.signing.outputs.mode == 'signed'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run package:desktop:win:release

      - name: Build the installer (unsigned — no certificate secret configured)
        if: steps.signing.outputs.mode != 'signed'
        shell: bash
        run: npm run package:desktop:win

      # forceCodeSigning only proves that electron-builder applied *a*
      # signature; it cannot tell us whether it is the right certificate,
      # whether the app exe and the installer agree, whether the uninstaller
      # was covered at all, or whether the signature was timestamped (an
      # untimestamped signature stops verifying the moment the certificate
      # expires). The CI signing job proves the pipeline with a throwaway
      # certificate; this step proves the artifact a customer will download.
      #
      # WIN_CSC_EXPECTED_SUBJECT is an optional pin: when the secret exists
      # the signer subject must match it exactly, when it does not the check
      # is skipped. Same degradation shape as the certificate gate above, so
      # adding the pin later is a one-secret change and never a code change.
      - name: "Verify the release signature (app exe, installer, uninstaller)"
        if: steps.signing.outputs.mode == 'signed'
        shell: pwsh
        env:
          EXPECTED_SUBJECT: ${{ secrets.WIN_CSC_EXPECTED_SUBJECT }}
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = "packages\desktop\release"
          $exe = Join-Path $releaseDir "win-unpacked\WindowRunner.exe"
          $setup = Get-ChildItem $releaseDir -Filter "*-Setup-*.exe" | Select-Object -First 1
          # electron-builder.yml states signing covers "app exe, uninstaller,
          # NSIS installer". The uninstaller runs on user machines during
          # uninstall and raises its own SmartScreen prompt if it goes out
          # unsigned, so it is asserted here rather than assumed.
          $uninstall = Get-ChildItem (Join-Path $releaseDir "win-unpacked") -Filter "Uninstall*.exe" | Select-Object -First 1
          if (!$setup) { throw "no installer produced in $releaseDir" }
          if (!$uninstall) { throw "no uninstaller produced — cannot verify it was signed" }

          $subjects = @()
          foreach ($file in @($exe, $setup.FullName, $uninstall.FullName)) {
            if (!(Test-Path $file)) { throw "missing build output: $file" }
            $sig = Get-AuthenticodeSignature -FilePath $file
            Write-Host "$file -> status=$($sig.Status) signer=$($sig.SignerCertificate.Subject) timestamp=$($sig.TimeStamperCertificate.Subject)"
            if ($sig.Status -eq "NotSigned") {
              throw "NOT SIGNED: $file — forceCodeSigning should have failed the build first"
            }
            if ($null -eq $sig.SignerCertificate) {
              throw "NO SIGNER CERTIFICATE: $file — the signature carries no certificate"
            }
            # A signature without an RFC 3161 counter-signature stops verifying
            # when the certificate expires, which for a shipped installer means
            # SmartScreen warnings reappear at the worst possible time.
            if ($null -eq $sig.TimeStamperCertificate) {
              throw "NOT TIMESTAMPED: $file — the signature will stop verifying when the certificate expires"
            }
            # The CI signing job deliberately signs with a throwaway
            # certificate. It must never be what reaches a release artifact.
            if ($sig.SignerCertificate.Subject -match "WindowRunner CI Signing Proof") {
              throw "TEST CERTIFICATE IN RELEASE: $file is signed by the CI signing-proof certificate, which is untrusted by design and must never ship"
            }
            $subjects += $sig.SignerCertificate.Subject
          }

          $distinct = $subjects | Sort-Object -Unique
          if ($distinct.Count -ne 1) {
            throw "SIGNER MISMATCH across artifacts: $($distinct -join ' | ') — the app exe, installer and uninstaller must all carry the same signature"
          }
          Write-Host "signer: $($distinct[0])"

          if ($EXPECTED_SUBJECT) {
            if ($distinct[0] -ne $EXPECTED_SUBJECT) {
              # Name renewal explicitly: the overwhelmingly likely cause of a
              # subject mismatch is a replaced or renewed certificate whose CN
              # changed, and the fix is the secret, not the build.
              throw "WRONG SIGNER: expected '$EXPECTED_SUBJECT' but got '$($distinct[0])'. The usual cause is certificate renewal or replacement: update the WIN_CSC_EXPECTED_SUBJECT repository secret to the new certificate's subject."
            }
            Write-Host "signer matches the pinned WIN_CSC_EXPECTED_SUBJECT"
          } else {
            Write-Host "::notice title=signer pin::WIN_CSC_EXPECTED_SUBJECT is not configured — the signer was verified structurally but not pinned to an expected subject."
          }
          Write-Host "::notice title=signing gate::Verified: app exe, installer and uninstaller are timestamped and signed by $($distinct[0])"

      # Same install → journey → uninstall gate as the per-PR installer job
      # (minus the upgrade phases, which need two versions): the release
      # artifact is exercised, not just produced.
      - name: "Install silently (per-user, no UAC) and assert the app is present"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Get-ChildItem packages\desktop\release\*-Setup-*.exe | Select-Object -First 1
          if (!$setup) { throw "no installer produced" }
          Write-Host "installing $($setup.FullName)"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -PassThru -Wait
          $exe = Join-Path $env:LOCALAPPDATA "Programs\WindowRunner\WindowRunner.exe"
          for ($i = 0; $i -lt 60; $i++) {
            if (Test-Path $exe) { break }
            Start-Sleep -Seconds 1
          }
          if (!(Test-Path $exe)) { throw "installed executable not found at $exe (installer exit $($p.ExitCode))" }
          Write-Host "ASSERT PASS: silent install verified — WindowRunner.exe present at $exe"
          "WR_ELECTRON_EXECUTABLE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: "E2E against the installed app (boot -> auto-auth -> mock turn -> clean shutdown)"
        shell: bash
        run: npm run e2e --workspace packages/desktop
        env:
          CI: "1"

      - name: "Uninstall silently and assert the app is removed"
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA "Programs\WindowRunner\WindowRunner.exe"
          $dir = Split-Path $exe
          $un = Get-ChildItem $dir -Filter "Uninstall*.exe" | Select-Object -First 1
          if (!$un) { throw "uninstaller not found in $dir" }
          Start-Process -FilePath $un.FullName -ArgumentList "/S" -Wait
          for ($i = 0; $i -lt 60; $i++) {
            if (!(Test-Path $exe)) { break }
            Start-Sleep -Seconds 1
          }
          if (Test-Path $exe) { throw "uninstall left $exe behind" }
          Write-Host "ASSERT PASS: silent uninstall verified"

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: release-installer
          path: packages/desktop/release/*-Setup-*.exe
          if-no-files-found: error
          retention-days: 7

      # Update metadata for the future auto-updater (nothing consumes it yet).
      # electron-builder emits latest.yml/blockmap only when a publish
      # provider is configured, which this repo does not have yet — so this
      # upload is optional and simply skips when there is nothing to attach.
      - name: Upload the update metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-installer-metadata
          path: |
            packages/desktop/release/latest.yml
            packages/desktop/release/*.exe.blockmap
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [guard, cli, installer]
    permissions:
      # Only this job can write, and only what a draft release needs.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd release-files
          node ../scripts/checksums.mjs --out . *
          echo "SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      - name: Extract the release notes from the changelog
        run: |
          node scripts/release-notes.mjs "${GITHUB_REF_NAME}" --out notes.md
          # An unsigned build is a fact the publisher must see in the draft.
          if [ "${{ needs.installer.outputs.signed }}" != "true" ]; then
            printf '\n---\n\n**Warning: this build is UNSIGNED** — the WIN_CSC_LINK repository secret is not configured, so the installer carries no Authenticode signature and Windows SmartScreen will warn on first run (docs/INSTALL.md -> "Code signing and SmartScreen"). Verify the SHA256SUMS.txt sidecar before installing, or build from source.\n' >> notes.md
          fi
          # The checksums travel in the body as well as the sidecar file.
          printf '\n---\n\n### SHA-256 checksums\n\n```\n' >> notes.md
          cat release-files/SHA256SUMS.txt >> notes.md
          printf '```\n' >> notes.md

      # Draft: publishing is a deliberate human action.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "WindowRunner ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            release-files/*
          echo "::notice title=release::Draft release ${GITHUB_REF_NAME} created with all artifacts — review and publish."
